<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - RM Airdrop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07080d;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #0e1018;
      border: 1px solid #252938;
      border-radius: 20px;
      padding: 32px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      width: 55px;
      height: 55px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(135deg,#7c5cff,#a986ff);
      box-shadow: 0 10px 35px rgba(124,92,255,.3);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8e95a7;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #c5c9d5;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border: 1px solid #292d3a;
      border-radius: 11px;
      outline: none;
      background: #121520;
      color: white;
      font-size: 14px;
    }

    input:focus {
      border-color: #7c5cff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #7c5cff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px;
      border-radius: 9px;
      font-size: 13px;
      text-align: center;
    }

    .success {
      display: block;
      background: rgba(53,208,127,.1);
      color: #35d07f;
    }

    .error {
      display: block;
      background: rgba(255,70,70,.1);
      color: #ff7777;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #8e95a7;
      font-size: 14px;
    }

    .login a {
      color: #a18aff;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777e91;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">RM</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Join RM Airdrop today
    </p>

    <form id="signupForm">

      <label>Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your name"
        required
      >

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" id="signupBtn">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
      ← Back to RM Airdrop
    </a>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
      IMPORTANT:
      এখানে নিজের Supabase Project URL এবং
      Publishable Key বসাবে।

      Service Role / Secret Key এখানে কখনো ব্যবহার করবে না।
    */

    const SUPABASE_URL = "https://coqexpuczbrtfvrpxjuk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Kc0DnMmpsKOTZTr1idZkkQ_VbNP4x0x";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupBtn");
    const message = document.getElementById("message");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }


      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );
        return;
      }


      button.disabled = true;
      button.textContent = "Creating account...";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: fullName
              }
            }

          });


        if (error) {
          throw error;
        }


        showMessage(
          "Account created successfully! Check your email if confirmation is required.",
          "success"
        );


        form.reset();


      } catch (error) {

        showMessage(
          error.message || "Signup failed.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Create Account";

      }

    });

  </script>

</body>
</html>
