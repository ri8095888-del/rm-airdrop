<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — RM Airdrop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #07080d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #0e1018;
      border: 1px solid #242735;
      border-radius: 20px;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }

    .logo {
      width: 55px;
      height: 55px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg,#7c5cff,#a884ff);
      font-weight: 800;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8e95a7;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #c7cad5;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #292d3b;
      background: #121520;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #7c5cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 11px;
      background: #7c5cff;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      text-align: center;
      font-size: 13px;
    }

    .error {
      display: block;
      background: #32171b;
      color: #ff9ca6;
    }

    .success {
      display: block;
      background: #123021;
      color: #7ee2a7;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #8e95a7;
      font-size: 13px;
    }

    .login a {
      color: #a48cff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">RM</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Join RM Airdrop
    </p>

    <form id="signupForm">

      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <button id="signupBtn" type="submit">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

<script>
  // ==============================
  // SUPABASE CONFIG
  // ==============================

  const SUPABASE_URL = "https://coqexpuczbrtfvrpxjuk.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Kc0DnMmpsKOTZTr1idZkkQ_VbNP4x0x";

  const { createClient } =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==============================
  // SIGNUP
  // ==============================

  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupBtn");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Creating account...";

    showMessage("", "");

    try {

      const { data, error } =
        await supabase.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: name
            }
          }

        });

      if (error) {
        throw error;
      }

      showMessage(
        "Account created successfully. Check your email if confirmation is required.",
        "success"
      );

      form.reset();

    } catch (error) {

      showMessage(
        error.message || "Signup failed.",
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent = "Create Account";

    }

  });
</script>

</body>
</html>
